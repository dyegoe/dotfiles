# herdr configuration — symlinked to ~/.config/herdr/config.toml by setup_herdr.
# Keybindings are intentionally left at herdr's defaults (prefix = ctrl+b).
# Full reference: `herdr --default-config` or https://herdr.dev/docs/config-reference/
# Reload a running server after editing: `herdr server reload-config`

# Skip the first-run flow; agent integrations are managed with
# `herdr integration install|status` instead of the onboarding UI.
onboarding = false

[terminal]
# Like tmux's `split-window -c "#{pane_current_path}"`: new panes and tabs start
# in the focused pane's directory. herdr has a single policy for panes, tabs and
# workspaces, so new workspaces are sent to $HOME by the key override below.
new_cwd = "follow"

[keys]
# Free the default chord so the custom command below owns it.
new_workspace = ""

[[keys.command]]
key = "prefix+shift+n"
type = "shell"
command = 'herdr workspace create --cwd "$HOME" --focus'

[theme]
name = "catppuccin"

[ui]
# Replaces the tmux catppuccin status-right (session + uptime).
tab_bar_right = [
  { type = "zoom" },
  { type = "hostname" },
  { type = "datetime", format = "%H:%M" },
]
status_indicators = "symbols"
pane_borders = "always"
pane_outer_borders = true

[ui.toast]
delivery = "herdr"

[ui.sidebar.agents]
rows = [["state_icon", "machine", "workspace", "tab", "pane"], ["agent"]]

