[env]
TERM = "xterm-256color"

[window]
opacity = 1
padding.x = 10
padding.y = 10
dimensions.columns = 160
dimensions.lines = 70

[font]
size = 12

[font.offset]
x = 0
y = 0

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.italic]
family = "Hack Nerd Font"
style = "Italic"

[font.bold_italic]
family = "Hack Nerd Font"
style = "Bold Italic"

[terminal.shell]
program = "/usr/bin/env"
args = ["zsh", "--login", "-c", "tmux new-session -A -s main"]

[scrolling]
history = 10000

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"

[colors.normal]
black = "#45475a"
red = "#d20f39"
green = "#40a02b"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"

[colors.bright]
black = "#585b70"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#a6adc8"

[colors.cursor]
cursor = "#b4befe"
text = "#1e1e2e"

